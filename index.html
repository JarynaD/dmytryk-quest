<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Інтерактивний Minecraft-квест до 7-річчя Дмитрика: 8 загадок, підказки та скарби."><meta name="theme-color" content="#163b2b"><title>Дмитрик — 8 смарагдів</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;background:#10271e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#346d4b 0,transparent 35%),linear-gradient(145deg,#183b2b,#091b16);display:grid;place-items:center;padding:20px}.wrap{width:min(720px,100%)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.badge{background:#123425;border:2px solid #6cd997;border-radius:12px;padding:9px 13px;font-weight:800}.card{background:#18392e;border:4px solid #65bd70;box-shadow:10px 10px 0 #071b13;border-radius:8px;overflow:hidden}.scene{min-height:165px;display:grid;place-items:center;position:relative;background:linear-gradient(#5a9fbc 0 65%,#53854a 65% 74%,#74543b 74%);border-bottom:8px solid #456f38}.scene:before{content:'✦　✦　✦';position:absolute;top:20px;left:18px;color:#fff9;letter-spacing:18px}.scene:after{content:'🟩 🟫 🟩 🟫 🟩 🟫 🟩';position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:9px;opacity:.65}.scene .emoji{font-size:75px;filter:drop-shadow(6px 6px 0 #0004)}.content{padding:clamp(20px,5vw,40px)}.eyebrow{font-size:13px;letter-spacing:2px;color:#a7f6bb;font-weight:900;text-transform:uppercase}h1{font-size:clamp(26px,6vw,39px);line-height:1.13;margin:12px 0 18px}p{line-height:1.65;font-size:clamp(16px,3.5vw,19px)}.riddle{background:#0e291f;border-left:5px solid #88e49b;padding:15px 19px;border-radius:4px;white-space:pre-line;line-height:1.7;font-size:clamp(17px,3.5vw,20px)}.actions{display:grid;gap:12px;margin-top:24px}button{border:0;border-radius:6px;padding:16px;font-weight:900;font-size:17px;cursor:pointer;min-height:54px}button:focus-visible{outline:3px solid white;outline-offset:3px}.primary{background:#79db76;color:#092516;box-shadow:0 5px 0 #327a3b}.secondary{background:#e9c45f;color:#302511;box-shadow:0 5px 0 #99722c}.ghost{background:#294f41;color:white;border:1px solid #6d9c7c}.hint{background:#f6e8b5;color:#3a301c;padding:16px;border-radius:6px;margin-top:16px;line-height:1.55}.progress{display:flex;gap:6px;margin:14px 0}.slot{height:13px;flex:1;background:#3a5d49;border:1px solid #7fa68a;border-radius:3px}.slot.done{background:#73e99c}.toast{position:fixed;z-index:5;top:16px;left:50%;transform:translateX(-50%);padding:15px 22px;border:3px solid #c7ff91;background:#1b5232;box-shadow:6px 6px 0 #071b13;font-weight:900;text-align:center;max-width:92vw;animation:appear .25s ease-out}.toast[hidden]{display:none}@keyframes appear{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}.toolbar{display:flex;justify-content:flex-end;margin:10px 0}.toolbar button{font-size:12px;min-height:36px;padding:8px 12px}.footer{margin:20px 0;text-align:center;color:#b8d5c4;font-size:13px}.mini{font-size:14px;color:#c4e5cc}.confetti{font-size:44px;text-align:center;animation:bounce 1s infinite alternate}@keyframes bounce{to{transform:translateY(-13px)}}@media(prefers-reduced-motion:reduce){.confetti{animation:none}}

.scene{overflow:hidden;isolation:isolate}.scene .emoji{position:relative;z-index:2;animation:floatIn .7s cubic-bezier(.2,1.3,.4,1),bob 3s ease-in-out .7s infinite alternate}.scene .spark{position:absolute;z-index:1;font-size:23px;animation:twinkle 2.4s ease-in-out infinite alternate;pointer-events:none}.scene .spark.one{left:16%;top:28%}.scene .spark.two{right:15%;top:24%;animation-delay:.8s}.scene .spark.three{right:29%;bottom:25%;animation-delay:1.5s}.scene[data-biome="ice"]{background:linear-gradient(#87b8e4 0 66%,#d7f6fa 66% 76%,#a6d6e3 76%)}.scene[data-biome="night"]{background:linear-gradient(#14274c 0 72%,#284b38 72%)}.scene[data-biome="portal"]{background:linear-gradient(140deg,#4d2c79,#131d3f 72%)}.scene[data-biome="forest"]{background:linear-gradient(#4c9165 0 65%,#376a3b 65% 78%,#62462e 78%)}.scene[data-biome="water"]{background:linear-gradient(#2b87ba,#06496c)}.scene[data-biome="gold"]{background:linear-gradient(#d6a44b,#70512c)}
@keyframes floatIn{from{transform:translateY(35px) scale(.5);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}@keyframes bob{to{transform:translateY(-10px)}}@keyframes twinkle{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.3)}}
#burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.piece{position:absolute;top:-35px;width:11px;height:17px;animation:fall var(--duration) cubic-bezier(.15,.7,.45,1) forwards;animation-delay:var(--delay);background:var(--color);transform:rotate(var(--rotation))}@keyframes fall{to{top:110vh;transform:translateX(var(--drift)) rotate(760deg);opacity:0}}.level-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.level-nav button{min-height:40px;padding:8px 11px;font-size:14px;flex:1}.visited{background:#315d47;color:white;border:1px solid #89bd94}.scene .emoji{white-space:pre-line;text-align:center}.tiny-note{color:#c4e5cc;font-size:14px;margin-top:12px}
@media(prefers-reduced-motion:reduce){.scene .emoji,.scene .spark,.piece{animation:none!important}}
</style></head><body><main class="wrap"><header class="top"><div class="badge">⛏️ КВЕСТ ДМИТРИКА</div><div class="badge" id="counter">💎 0 / 8</div></header><div class="progress" id="progress" aria-label="Прогрес гри"></div><div class="toolbar"><button id="homeButton" class="ghost" type="button" hidden>🏠 На головну</button><button id="soundToggle" class="ghost" type="button" aria-pressed="false">🔇 Звук вимкнено</button></div><section class="card"><div class="scene" id="scene"><span class="spark one">✦</span><span class="spark two">💠</span><span class="spark three">✦</span><span class="emoji" id="sceneEmoji">🗺️</span></div><div class="content" id="content" aria-live="polite"></div></section><div class="toast" id="toast" role="status" hidden></div><div id="burst" aria-hidden="true"></div><div class="footer">8 схованок • 8 скарбів • одна велика пригода 💚</div></main><script>
const levels=[
{title:'Крижаний біом',emoji:'❄️ 🧊',riddle:'У Minecraft є біоми, де завжди холодно.\n\nА у твоєму будинку є місце, де зима триває цілий рік!\n\nТам живуть молоко, сир і морозиво. Але твій смарагд заховався не всередині, а там, куди зазвичай не заглядають.\n\nПідказка: підніми погляд вище дверцят!',hints:['Шукай на кухні, де продукти залишаються холодними.','Перший скарб лежить НА холодильнику.']},
{title:'Переплутаний крафт',emoji:'🧩 ⛏️',riddle:'Кріпер перемішав літери назви предмета!\n\nТ А М Р А Ц\n\nСклади правильне слово з усіх шести літер.\n\nЦей предмет є у твоїй власній базі відпочинку. Не шукай зверху — скарб під ним!',hints:['Це те, на чому ти спиш.','Шукай ПІД матрацом свого ліжка.']},
{title:'База двох захисників',emoji:'🌙 🛡️',riddle:'У Minecraft гравці будують бази, щоб ховатися від мобів.\n\nУ твоєму будинку теж є база двох найважливіших захисників. Вони піклуються про тебе, допомагають і завжди поруч.\n\nЗнайди місце, де вони відпочивають уночі, і перевір простір під ним.',hints:['Ці двоє — твої батьки.','Зазирни ПІД ліжко батьків.']},
{title:'Зламаний портал',emoji:'🔮 ⚡',riddle:'Кріпер зашифрував назву наступного порталу!\n\nКЛЮЧ: 1=Т · 2=Е · 3=Л · 4=В · 5=І · 6=З · 7=О · 8=Р\n\nРОЗВ’ЯЖИ:\n3−2 | 1+1 | 6−3 | 5−3 | 2+2 | 10÷2 | 3+3 | 9−2 | 4+4\n\nЗнайди цей портал там, де готують їжу. Скарб захований за ним!',hints:['Цифри після обчислень заміни літерами з ключа.','Відповідь — ТЕЛЕВІЗОР. Шукай ЗА телевізором на кухні.']},
{title:'Таємна база трьох гравців',emoji:'🏰 🌟',riddle:'У секретному біомі відпочивають троє гравців: ЯРИНА, СТАС ТА ЕМІЛІЯ.\n\nАле скарб не там, де вони сплять!\n\nЯ круглий, але не колесо.\nМаю ніжки, але не ходжу.\nМожу тримати речі, хоча не маю рук.\n\nЗнайди мене та перевір мою нижню сторону!',hints:['Це невеликий предмет меблів у спальні Ярини, Стаса й Емілії.','Шукай прикріплений скарб ПІД круглим столиком.']},
{title:'Дерев’яний трон',emoji:'🌳 👑',riddle:'У великій кімнаті, де збираються гравці, стоїть ціла армія дерев’яних тронів!\n\nВони не м’які, але на них можна сидіти.\n\nКріпер заховав смарагд під одним із них. Знайди правильний трон і перевір його знизу!',hints:['Шукай дерев’яні крісла у вітальні.','Скарб прикріплено ПІД одним із дерев’яних крісел. Перевіряй їх по черзі.']},
{title:'Зелений моб',emoji:'🌿 🟩',riddle:'Я можу бути зеленим, але я не Кріпер.\nЯ п’ю воду, але не маю рота.\nЯ росту, але не пересуваюся.\nЯ стою біля входу, але не охороняю двері.\n\nЩо я? Знайди мене в коридорі й зазирни за мене!',hints:['Це жива рослина у горщику.','Шукай ЗА вазонком при вході в коридор.']},
{title:'Водяний храм',emoji:'🌊 🔱',riddle:'ФІНАЛЬНИЙ РІВЕНЬ!\n\nВоду п’ю, але не живу.\nКручусь, але не біжу.\nБрудні речі забираю,\nА чистенькі повертаю.\n\nЗнайди цей механізм у водяному біомі свого будинку. Останній скарб чекає поруч!',hints:['Цей механізм пере одяг у ванній кімнаті.','Останній скарб — БІЛЯ пральної машини у ванній.']}
];
const key='dmytryk_emerald_quest_v1';
let sound=false,audioContext,toastTimer;
const content=document.getElementById('content'),emoji=document.getElementById('sceneEmoji'),counter=document.getElementById('counter'),progress=document.getElementById('progress'),homeButton=document.getElementById('homeButton'),scene=document.getElementById('scene');
const soundToggle=document.getElementById('soundToggle');
soundToggle.addEventListener('click',()=>{sound=!sound;soundToggle.textContent=sound?'🔊 Звук увімкнено':'🔇 Звук вимкнено';soundToggle.setAttribute('aria-pressed',String(sound));if(sound)beep(523)});
function beep(freq=660){if(!sound)return;try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.045,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.14);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.15)}catch(e){}}
function celebrate(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2200);beep(784);setTimeout(()=>beep(988),160)}
function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=document.getElementById('burst');const colors=['#76e886','#ffe16e','#a9ecff','#ff86a6','#d9a4ff'];for(let i=0;i<75;i++){const el=document.createElement('i');el.className='piece';el.style.cssText=`left:${Math.random()*100}%;--duration:${2+Math.random()*1.9}s;--delay:${Math.random()*.4}s;--drift:${(Math.random()-.5)*250}px;--rotation:${Math.random()*360}deg;--color:${colors[i%colors.length]}`;layer.append(el);setTimeout(()=>el.remove(),4800)}}
// highest = number of treasures already collected; view = currently visible level (or home).
let state={highest:0,view:-1,hints:{}};
try{const saved=JSON.parse(localStorage.getItem(key));if(saved){if(Number.isInteger(saved.highest)){state.highest=Math.max(0,Math.min(8,saved.highest));state.view=Number.isInteger(saved.view)?saved.view:-1}else if(Number.isInteger(saved.screen)){state.highest=Math.max(0,Math.min(8,saved.screen));state.view=-1}state.hints=saved.hints||{}}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function btn(label,cls,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.className=cls;b.addEventListener('click',fn);return b}
function addText(tag,value,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=value;content.append(e);return e}
function go(view){state.view=view;save();render();window.scrollTo({top:0,behavior:'smooth'})}
homeButton.addEventListener('click',()=>go(-1));
const biomes=['ice','night','night','portal','gold','forest','forest','water'];
function setScene(symbol,biome){scene.dataset.biome=biome;emoji.textContent=symbol;emoji.style.animation='none';void emoji.offsetWidth;emoji.style.animation=''}
function render(){content.replaceChildren();const v=state.view;homeButton.hidden=v===-1;counter.textContent=`💎 ${state.highest} / 8`;progress.replaceChildren();for(let i=0;i<8;i++){const el=document.createElement('div');el.className='slot'+(i<state.highest?' done':'');progress.append(el)}
if(v===-1){setScene('🗺️ 💎','forest');addText('div','СЕКРЕТНЕ ПОВІДОМЛЕННЯ ВІД СТІВА','eyebrow');addText('h1','Дмитрику, з 7-річчям! 🎉');addText('p','Кріпер розкидав 8 чарівних смарагдів по різних біомах твого будинку. Кожен перетворився на справжній скарб!');addText('p','Розгадуй загадки, знаходь скарби та збирай смарагди. Ти завжди можеш повернутися на головну та перечитати вже пройдені рівні.');const a=document.createElement('div');a.className='actions';a.append(btn(state.highest===0?'⛏️ ПОЧАТИ ПРИГОДУ':state.highest===8?'🏆 ПЕРЕГЛЯНУТИ ФІНАЛ':`▶️ ПРОДОВЖИТИ — РІВЕНЬ ${state.highest+1}`,'primary',()=>go(state.highest===8?8:state.highest)));a.append(btn('📖 ПЕРЕГЛЯНУТИ З ПЕРШОГО РІВНЯ','ghost',()=>go(0)));content.append(a);if(state.highest>0)addText('p',`Уже знайдено ${state.highest} із 8 скарбів. Прогрес збережено!`,'tiny-note');return}
if(v===8){setScene('🏆 💎 🎉','gold');addText('div','ДОСЯГНЕННЯ РОЗБЛОКОВАНО','eyebrow');addText('h1','МІСІЮ ВИКОНАНО!');addText('div','🎉 💎 🎉','confetti');addText('p','8 із 8 смарагдів знайдено! Дмитрику, ти пройшов усі випробування, розгадав загадки та переміг Кріпера!');addText('p','Ти — МАЙСТЕР MINECRAFT-ПРИГОД! Нехай твоє життя буде сповнене відкриттів, друзів і щасливих моментів. З 7-річчям! 💚');const a=document.createElement('div');a.className='actions';a.append(btn('📖 ПЕРЕГЛЯНУТИ ВСІ РІВНІ','secondary',()=>go(0)));a.append(btn('↻ Скинути прогрес і почати заново','ghost',()=>{if(confirm('Скинути всі знайдені смарагди та почати спочатку?')){state={highest:0,view:-1,hints:{}};save();render()}}));content.append(a);return}
const l=levels[v];setScene(l.emoji,biomes[v]);addText('div',`РІВЕНЬ ${v+1} ІЗ 8`,'eyebrow');addText('h1',l.title);addText('div',l.riddle,'riddle');const used=Math.min(2,Math.max(0,Number(state.hints[v])||0));for(let j=0;j<used;j++)addText('div',`💡 Підказка ${j+1}: ${l.hints[j]}`,'hint');const a=document.createElement('div');a.className='actions';
if(v<state.highest){addText('p','✅ Цей скарб уже знайдено. Можеш перечитати завдання або йти далі.','tiny-note');a.append(btn('➡️ ДАЛІ','primary',()=>go(v+1)));}
else{a.append(btn('💎 ЗНАЙШОВ СКАРБ!','primary',()=>{state.highest=v+1;state.view=v+1;save();render();confetti();celebrate(state.highest===8?'🏆 Усі 8 смарагдів знайдено!':`💎 Смарагд ${state.highest}/8 знайдено!`);window.scrollTo({top:0,behavior:'smooth'})}));}
if(used<2)a.append(btn(`💡 ${used===0?'ПОТРІБНА ПІДКАЗКА':'ЩЕ ОДНА ПІДКАЗКА'}`,'secondary',()=>{state.hints[v]=used+1;save();render();beep(440)}));
if(v===state.highest)a.append(btn('🔎 ЩЕ ШУКАЮ','ghost',()=>{const old=document.getElementById('keep');if(old)old.remove();const p=document.createElement('p');p.id='keep';p.className='mini';p.textContent='Ти впораєшся! Уважно прочитай загадку ще раз. ⛏️';content.append(p)}));content.append(a);
const nav=document.createElement('div');nav.className='level-nav';if(v>0)nav.append(btn('⬅️ Попередній рівень','visited',()=>go(v-1)));nav.append(btn('🏠 На головну','visited',()=>go(-1)));content.append(nav);
}render();
</script></body></html>
